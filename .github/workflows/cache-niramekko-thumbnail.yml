name: Cache Niramekko thumbnail (one-time)
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cache-niramekko-thumbnail.yml'
permissions:
  contents: write
jobs:
  cache-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Save thumbnail into portfolio assets
        shell: bash
        run: |
          set -euo pipefail
          output="assets/images/work/061_niramekko_to5azPzqiMA.jpg"
          mkdir -p "$(dirname "$output")"
          curl --fail --location --silent --show-error --retry 3 --max-time 40             "https://i.ytimg.com/vi/to5azPzqiMA/hqdefault.jpg"             --output "$output"
          file "$output" | grep -qi 'JPEG image data'
          test "$(wc -c < "$output")" -gt 2000
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          old = 'https://i.ytimg.com/vi/to5azPzqiMA/hqdefault.jpg'
          new = 'assets/images/work/061_niramekko_to5azPzqiMA.jpg'
          if html.count(old) != 1:
              raise RuntimeError("Expected exactly one matching thumbnail URL")
          path.write_text(html.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output" index.html
          git rm -- .github/workflows/cache-niramekko-thumbnail.yml
          git commit -m "Store Niramekko thumbnail locally"
          git push
