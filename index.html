		}

			max-width: 980px;
			margin: 0 auto;
			padding: 28px 16px 56px;
		}

			align-items: baseline;
			justify-content: space-between;
			gap: 16px;
			padding: 154px 0 154px;
			margin-bottom: 18px;
		}

		.section-title {
			margin: 0 0 12px;
			font-size: 16px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: #fff;
		}

		.intro {
			min-width: 0;
		}

		.title {
			margin: 0;
			font-size: clamp(26px, 4vw, 38px);
			letter-spacing: 0.01em;
			text-transform: none;
			color: #fff;
			font-weight: 700;
		}

		.subtitle {
			margin: 6px 0 0;
			font-size: clamp(16px, 1.6vw, 20px);
			color: #b9b9b9;
		}

		.email {
			margin: 8px 0 0;
			font-size: 16px;
			color: #9a9a9a;
		}

		.email a {
			color: inherit;
			text-decoration: none;
		}

		.email a:hover {
			text-decoration: underline;
			text-underline-offset: 3px;
		}

		.count {
			margin: 0;
			font-size: 13px;
			color: #9a9a9a;
		}

		.list {
			display: block;
			border-top: 1px solid #202020;
		}

		.row {
			display: grid;
			grid-template-columns: 240px 1fr;
			gap: 14px;
			padding: 14px 0;
			border-bottom: 1px solid #202020;
		}

		.thumb {
			width: 240px;
			aspect-ratio: 16 / 9;
			border-radius: 10px;
			overflow: hidden;
			background: #000;
			border: 1px solid #1e1e1e;
			position: relative;
		}

		.thumb.is-missing {
			background: #000;
		}

		.thumb img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
			filter: saturate(0.92) contrast(1.02);
		}

		.meta {
			min-width: 0;
		}

		.name {
			margin: 0;
			font-size: 22px;
			color: #fff;
			font-weight: 600;
			word-break: break-word;
		}

		.badge {
			display: inline-block;
			margin-left: 8px;
			padding: 2px 8px;
			border: 1px solid #202020;
			border-radius: 999px;
			background: #000;
			color: #b9b9b9;
			font-size: 12px;
			line-height: 1.2;
			letter-spacing: 0.02em;
			vertical-align: middle;
		}

		.artist {
			margin: 4px 0 0;
			font-size: 18px;
			color: #b9b9b9;
		}

		.desc {
			margin: 10px 0 0;
			font-size: 17px;
			color: #9a9a9a;
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}

		.dot {
			width: 3px;
			height: 3px;
			border-radius: 999px;
			background: #4a4a4a;
			display: inline-block;
		}

		.row a {
			color: inherit;
			text-decoration: none;
			display: contents;
		}

		.row:hover .thumb {
			border-color: #2a2a2a;
		}

		.row:hover .name {
			text-decoration: underline;
			text-decoration-color: #3a3a3a;
			text-underline-offset: 4px;
		}

		.portfolio-links {
			grid-column: 2;
			display: flex;
			gap: 16px;
			margin-top: -4px;
			font-size: 15px;
		}

		.row .portfolio-links a {
			display: inline;
			color: #b9b9b9;
			text-decoration: underline;
			text-underline-offset: 3px;
		}

		.empty {
			padding: 18px 0;
			color: #9a9a9a;
			font-size: 13px;
		}

		.credit {
			margin: 28px 0 0;
			padding-top: 18px;
			border-top: 1px solid #202020;
			font-size: 13px;
			color: #9a9a9a;
			text-align: center;
		}

		.credit a {
			color: inherit;
			text-decoration: none;
		}

		.credit a:hover {
			text-decoration: underline;
			text-underline-offset: 3px;
		}

		@media (max-width: 560px) {
			.topline {
				flex-direction: column;
				align-items: flex-start;
				padding: 38px 0 28px;
			}

			.row {
				grid-template-columns: 170px 1fr;
			}

			.thumb {
				width: 170px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			* {
				scroll-behavior: auto !important;
				transition: none !important;
				animation: none !important;
			}
		}
	</style>
</head>

		const listEl = document.getElementById('list');
		const emptyEl = document.getElementById('empty');
		const countEl = document.getElementById('count');

		function escapeHtml(text) {
			return String(text)
				.replaceAll('&', '&amp;')
				.replaceAll('<', '&lt;')
				.replaceAll('>', '&gt;')
				.replaceAll('"', '&quot;')
				.replaceAll("'", '&#39;');
		}

		function markThumbMissing(img) {
			const wrapper = img.closest('.thumb');
			if (wrapper) wrapper.classList.add('is-missing');
			img.remove();
		}

		function looksLikeYoutubePlaceholder(sampleData) {
			const data = sampleData.data;
			const pixelCount = data.length / 4;
			let grayishCount = 0;
			let sum = 0;
			let sumSq = 0;
			let minL = 255;
			let maxL = 0;

			for (let i = 0; i < data.length; i += 4) {
				const r = data[i];
				const g = data[i + 1];
				const b = data[i + 2];

				const max = Math.max(r, g, b);
				const min = Math.min(r, g, b);
				if (max - min < 12) grayishCount += 1;

				const l = (r + g + b) / 3;
				sum += l;
				sumSq += l * l;
				if (l < minL) minL = l;
				if (l > maxL) maxL = l;
			}

			const mean = sum / pixelCount;
			const variance = sumSq / pixelCount - mean * mean;
			const contrast = maxL - minL;
			const grayFrac = grayishCount / pixelCount;

			return grayFrac > 0.92 && contrast < 80 && variance < 900;
		}

		const youtubeOembedCache = new Map();

		function getYoutubeLinkFromThumb(img) {
			const a = img.closest('.row')?.querySelector('a');
			if (!a) return '';
			return a.href || '';
		}

		async function isYoutubeVideoPublic(youtubeLink) {
			if (!youtubeLink) return null;
			if (youtubeOembedCache.has(youtubeLink)) return youtubeOembedCache.get(youtubeLink);

			const promise = fetch(
				`https://www.youtube.com/oembed?url=${encodeURIComponent(youtubeLink)}&format=json`,
				{ method: 'GET' },
			)
				.then((res) => res.ok)
				.catch(() => null);

			youtubeOembedCache.set(youtubeLink, promise);
			return promise;
		}

		function maybeHideEllipsisThumb(img) {
			const src = img.currentSrc || img.src;
			if (!src) return;
			if (!/ytimg\.com\//i.test(src) && !/img\.youtube\.com\//i.test(src)) return;

			const probe = new Image();
			probe.crossOrigin = 'anonymous';
			probe.decoding = 'async';
			probe.onload = () => {
				try {
					const canvas = document.createElement('canvas');
					const w = 32;
					const h = 18;
					canvas.width = w;
					canvas.height = h;
					const ctx = canvas.getContext('2d', { willReadFrequently: true });
					if (!ctx) return;
					ctx.drawImage(probe, 0, 0, w, h);
					const sample = ctx.getImageData(0, 0, w, h);
					if (looksLikeYoutubePlaceholder(sample)) {
						markThumbMissing(img);
					}
				} catch {
					// If CORS blocks pixel reads, fallback to oEmbed check.
					const link = getYoutubeLinkFromThumb(img);
					isYoutubeVideoPublic(link).then((isPublic) => {
						if (!img.isConnected) return;
						if (isPublic === false) markThumbMissing(img);
					});
				}
			};
			probe.onerror = () => {
				// If we can't probe it safely, fallback to oEmbed check.
				const link = getYoutubeLinkFromThumb(img);
				isYoutubeVideoPublic(link).then((isPublic) => {
					if (!img.isConnected) return;
					if (isPublic === false) markThumbMissing(img);
				});
			};
			probe.src = src;
		}

		function render() {
			countEl.textContent = ``;

			if (!Array.isArray(portfolioData) || portfolioData.length === 0) {
				emptyEl.hidden = false;
				return;
			}

			const html = portfolioData.map((item) => {
				const title = escapeHtml(item.title ?? '');
				const artistRaw = String(item.artist ?? '');
				const artist = escapeHtml(artistRaw);
				const link = escapeHtml(item.youtubeLink ?? '#');
				const coverRaw = String(item.coverImage ?? '');
				const cover = escapeHtml(coverRaw);
				const desc = escapeHtml(item.description ?? '');
				const badge = item.isNew ? `<span class="badge">new !</span>` : '';

				const thumbClass = cover ? 'thumb' : 'thumb is-missing';
				const thumbInner = cover ? `<img src="${cover}" alt="${title}" loading="lazy" />` : '';

				return `
					<div class="row">
						<a href="${link}" target="_blank" rel="noopener noreferrer">
							<div class="${thumbClass}">${thumbInner}</div>
							<div class="meta">
								<p class="name">${title}${badge}</p>
								<p class="artist">${artist}</p>
								<p class="desc"><span class="dot"></span><span>${desc}</span></p>
							</div>
						</a>
						${item.html ? `<div class="portfolio-links">${item.html}</div>` : ''}
					</div>
				`;
			}).join('');

			listEl.innerHTML = html;

			listEl.querySelectorAll('.thumb img').forEach((img) => {
				img.addEventListener('error', () => {
					markThumbMissing(img);
				}, { once: true });

				img.addEventListener('load', () => {
					maybeHideEllipsisThumb(img);
				}, { once: true });
			});
		}

		render();
	</script>
