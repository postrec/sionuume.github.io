---
layout: v1
---

{% if page.collection == "posts" %}
<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.date %}
  <span class="post-date">{{ page.date | date: "%Y-%m-%d %a" }}</span>
  {% endif %}
  {{ content }}
</div>
{% else %}
<div class="page">
  <h1 class="page-title">{{ page.title }}</h1>
  {{ content }}
</div>
{% endif %}
