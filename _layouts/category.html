---
layout: v1
---


<h1>
</h1>
<ui class="posts-list">
    {% assign category = page.category | default: page.code %}
    <h1>{{page.title}}</h1>
    {% for post in site.categories[category] %}
        <div>
            <h3>
                <a href="{{post.url}}">{{post.title}}</a>
            </h3>
            <small>{{ post.date | date: "%Y-%m-%d %a" }}</small>
        </div>
    {% endfor %}
</ui>
